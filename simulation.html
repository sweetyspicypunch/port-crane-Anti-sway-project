<h2>시뮬레이션 결과</h2>
  <p>아래는 Anti-Sway Single Pendulum 시뮬레이션입니다.</p>

  <!-- ============================
       Single Pendulum Anti-Sway Block
       ============================ -->
  <div style="padding:20px; border:1px solid #ddd; border-radius:10px; margin-top:20px;">
    <h3>Single Pendulum Anti-Sway Simulation</h3>

    <canvas id="pendulumCanvas" width="600" height="400" 
            style="border:1px solid #ccc; background:#fafafa;"></canvas>

    <div style="margin-top:15px;">
      <button id="startSim">Start</button>
      <button id="stopSim">Stop</button>
      <button id="resetSim">Reset</button>
    </div>
  </div>

</div> <!-- container 끝 -->


<!-- ============================
     JS (Python Model 1:1 적용)
     ============================ -->
<script>
// ===========================
//   Physics Parameters
// ===========================
let g = 9.81;
let L = 1.0;
let dt = 0.01;

let theta = 20 * Math.PI/180;
let omega = 0;

let px = 0, pv = 0, pa = 0;
let px_target = 0;

// Gains (Python 동일)
let Kp_x = 2.0, Kd_x = 3.0;
let Kp_theta = 40.0, Kd_omega = 15.0;
let pa_limit = 15.0;

// Canvas
const canvas = document.getElementById("pendulumCanvas");
const ctx = canvas.getContext("2d");
let animationID = null;


// ===========================
//       RK4 Integrator
// ===========================
function f(theta, omega, pa) {
    let dtheta = omega;
    let domega = -(g/L)*Math.sin(theta) - (pa/L)*Math.cos(theta);
    return [dtheta, domega];
}

function rk4(theta, omega, pa, dt) {
    let [k1_t, k1_w] = f(theta, omega, pa);
    let [k2_t, k2_w] = f(theta + 0.5*dt*k1_t, omega + 0.5*dt*k1_w, pa);
    let [k3_t, k3_w] = f(theta + 0.5*dt*k2_t, omega + 0.5*dt*k2_w, pa);
    let [k4_t, k4_w] = f(theta + dt*k3_t, omega + dt*k3_w, pa);

    theta += dt*(k1_t + 2*k2_t + 2*k3_t + k4_t)/6;
    omega += dt*(k1_w + 2*k2_w + 2*k3_w + k4_w)/6;
    return [theta, omega];
}


// ===========================
//         Drawing
// ===========================
function drawPendulum() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Grid
    ctx.strokeStyle = "#eee";
    for (let x=0; x<canvas.width; x+=40){
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height);
        ctx.stroke();
    }
    for (let y=0; y<canvas.height; y+=40){
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y);
        ctx.stroke();
    }

    let originX = canvas.width/2 + px*150;
    let originY = 80;

    let bobX = originX + L*150*Math.sin(theta);
    let bobY = originY + L*150*Math.cos(theta);

    // Rod
    ctx.strokeStyle="#333"; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(originX,originY);
    ctx.lineTo(bobX,bobY);
    ctx.stroke();

    // Bob
    ctx.beginPath();
    ctx.arc(bobX,bobY,12,0,Math.PI*2);
    ctx.fillStyle="#d35400";
    ctx.fill();

    // Pivot
    ctx.beginPath();
    ctx.arc(originX,originY,8,0,Math.PI*2);
    ctx.fillStyle="#2c3e50";
    ctx.fill();
}


// ===========================
//     Simulation Update
// ===========================
function step() {

    // ---- Anti-Sway Controller (Python 동일) ----
    let a_pos   = Kp_x * (px_target - px) + Kd_x * (0 - pv);
    let a_angle = Kp_theta * theta + Kd_omega * omega;

    pa = a_pos + a_angle;
    pa = Math.max(-pa_limit, Math.min(pa, pa_limit));

    // Pivot update
    px += pv * dt;
    pv += pa * dt;

    // Pendulum RK4 update
    [theta, omega] = rk4(theta, omega, pa, dt);

    drawPendulum();
}

function loop() {
    step();
    animationID = requestAnimationFrame(loop);
}


// ===========================
//         Buttons
// ===========================
document.getElementById("startSim").onclick = () => {
    if (!animationID) loop();
};

document.getElementById("stopSim").onclick = () => {
    cancelAnimationFrame(animationID);
    animationID = null;
};

document.getElementById("resetSim").onclick = () => {
    theta = 20*Math.PI/180;
    omega = 0;
    px = 0; pv = 0; pa = 0;
    px_target = 0;
    drawPendulum();
};


// ===========================
//      Keyboard Input
// ===========================
document.addEventListener("keydown", (e)=>{
    if (e.key === "ArrowRight") px_target += 1.0;
    if (e.key === "ArrowLeft")  px_target -= 1.0;
});


// Initial Draw
drawPendulum();
</script>
