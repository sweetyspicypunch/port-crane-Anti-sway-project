    .navbar { 
      background: #003d99; padding: 12px 20px;
      display: flex; gap: 20px; justify-content: center;
    }
    .navbar a {
      color: white; font-weight: bold; text-decoration: none;
      padding: 5px 10px; border-radius: 6px; font-size: 1.05em;
    }
    .navbar a.active { background: white; color: #003d99; }

    .container {
      max-width: 900px; margin: 0 auto; padding: 25px;
      background: white; border-radius: 10px;
      margin-top: 20px; box-shadow: 0 3px 12px rgba(0,0,0,0.1);

<script>
  const currentPage = window.location.pathname.split('/').pop();
  document.querySelectorAll('.navbar a').forEach(link => {
    if (currentPage === link.getAttribute('href')) link.classList.add('active');
    if (!currentPage && link.getAttribute('href') === "index.html") link.classList.add('active');
  });
</script>
