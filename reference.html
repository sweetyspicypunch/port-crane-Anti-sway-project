<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Reference</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { margin: 0; background: #fafafa; font-family: "Segoe UI", sans-serif; }
    header { background: #0047ab; color: white; padding: 25px; text-align: center; }

    .navbar { 
      background: #003d99; padding: 12px 20px;
      display: flex; gap: 20px; justify-content: center;
    }
    .navbar a {
      color: white; font-weight: bold; text-decoration: none;
      padding: 5px 10px; border-radius: 6px; font-size: 1.05em;
    }
    .navbar a.active { background: white; color: #003d99; }

    .container {
      max-width: 900px; margin: 0 auto; padding: 25px;
      background: white; border-radius: 10px;
      margin-top: 20px; box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    footer { text-align: center; padding: 30px; color: #666; }

    /* ======= 모바일 최적화 영역 ======= */
    @media (max-width: 600px) {
    
      /* 전체 컨테이너 패딩 축소 */
      .container {
        padding: 18px 15px;
        margin-top: 15px;
      }
    
      /* 헤더 글자 크기 축소 */
      header h1 {
        font-size: 1.6em;
        line-height: 1.3em;
      }
    
      /* 네비게이션 바 줄바꿈 허용 + 폰트 축소 */
      .navbar {
        flex-wrap: wrap;
        gap: 10px;
      }
      .navbar a {
        font-size: 0.9em;
        padding: 6px 8px;
      }
    
      /* 팀 박스 내부 패딩 축소 */
      .team-box {
        padding: 20px !important;
      }
    
      /* 팀원 카드 1열로 강제 */
      .team-grid {
        grid-template-columns: 1fr !important;
      }
    
      /* 팀원 카드 여백 조정 */
      .member-card {
        padding: 15px !important;
      }
    
      /* 테이블 글자 크기 축소 (table 쓴 경우) */
      table {
        font-size: 0.95em;
        word-break: keep-all; /* 글자 단위 줄바꿈 */
      }
    }

    
  </style>
</head>

<body>

<header>
  <h1>참고문헌</h1>
</header>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="overview.html">Overview</a>
  <a href="model.html">Model</a>
  <a href="control.html">Control</a>
  <a href="simulation.html">Simulation</a>
  <a href="reference.html">Reference</a>
</nav>

<div class="container">
  <h2>참고문헌</h2>
  <p>여기에 참고문헌 목록을 작성하세요.</p>
</div>

<footer>
  © 2025 Port Crane Anti-Sway Project
</footer>

<script>
  const currentPage = window.location.pathname.split('/').pop();
  document.querySelectorAll('.navbar a').forEach(link => {
    if (currentPage === link.getAttribute('href')) link.classList.add('active');
    if (!currentPage && link.getAttribute('href') === "index.html") link.classList.add('active');
  });
</script>

</body>
</html>
