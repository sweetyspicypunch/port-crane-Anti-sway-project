<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Port Crane Anti-Sway Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; background: #fafafa; font-family: "Segoe UI", sans-serif; }

    header { background: #0047ab; color: white; padding: 35px; text-align: center; }

    /* --- Navbar 스타일 --- */
    .navbar {
      background: #003d99;
      padding: 12px 20px;
      display: flex;
      gap: 20px;

    }
    .navbar a.active {

    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
      background: white;
      margin-top: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    .menu-box {
      background: #f7f7f7;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 8px;
      font-size: 1.2em;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .menu-box:hover { background: #eef2ff; }

    .menu-box a { text-decoration: none; color: #003d99; font-weight: bold; }

    footer { margin-top: 40px; text-align: center; padding: 25px; color: #777; }
  </style>
</head>

<body>

<header>
  <h1>Port Crane Anti-Sway Project</h1>
</header>

<nav class="navbar">
  <a href="index.html">Home</a>

  <a href="simulation.html">Simulation</a>

</nav>

<div class="container">


  <div class="team-box" style="
    background: linear-gradient(to bottom right, #ffffff, #f3f6ff);
    padding: 28px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  ">
    <h2 style="color:#003d99;">👥 Team Members</h2>
    <p style="margin-bottom:18px;">
      저희 팀 "영&써티"은 항만 크레인의 Anti-Sway 시스템을 연구하고 제어 알고리즘 설계를 수행하는 것을 목표로 합니다.
    </p>

    <table style="width:100%; border-collapse:collapse;">
      <tr>

      </tr>
    </table>
  </div>

</div>
<footer>
  © 2025 Port Crane Anti-Sway Project
</footer>

<script>
  const currentPage = window.location.pathname.split('/').pop();
  const links = document.querySelectorAll('.navbar a');

  links.forEach(link => {
    const linkPage = link.getAttribute('href');

    if (!currentPage && linkPage === "index.html") {
      link.classList.add('active');
    }
    if (currentPage === linkPage) {
      link.classList.add('active');
    }
  });
</script>

</body>
